[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "asttel"
version = "1.0.0"
description = "Acquisition-State Telemetry: task-referenced telemetry of information acquisition"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
envs = [
    "gymnasium>=0.29",
    "minigrid>=2.3",
    "crafter>=1.8.3",
    "metaworld>=3.0",
    "mujoco>=3.0",
]
rl = [
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    "torch>=2.1",
]
tools = ["requests>=2.28"]
test = ["pytest"]

[tool.setuptools]
packages = ["asttel", "asttel.bindings", "asttel.rl"]
